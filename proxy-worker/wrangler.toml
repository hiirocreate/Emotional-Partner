name = "kokorotalk-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 有料プラン(サブスクリプション)の状態を保存するKVストア。
# `npx wrangler kv namespace create SUBSCRIBERS` を実行し、表示された id を
# 下の "REPLACE_WITH_KV_ID" に書き換えてください。サブスク機能を使わない場合は
# このブロックごと削除してデプロイしても構いません(その場合、管理者以外は
# 常に「未加入」として扱われます)。
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_WITH_KV_ID"

# 簡易レート制限(IPごとに60秒あたり20リクエストまで)。
# Cloudflareのプランによってはこのバインディングが使えない場合があります。
# その場合はこのブロックを削除してデプロイしてください(レート制限なしで動作します。
# X-App-Secretによる簡易ゲートは有効なままです)。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
