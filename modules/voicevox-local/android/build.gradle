plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.voicevoxlocal'
version = '0.1.0'

android {
  namespace "expo.modules.voicevoxlocal"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // voicevox_core のAndroidビルド済みライブラリはarm64のみ取得している
    // (実機のほぼ全てがarm64。x86_64はエミュレータ用で、必要なら別途取得して追加できる)
    ndk {
      abiFilters "arm64-v8a"
    }
  }
  // C++側のJNIラッパー(voicevox_jni.cpp)をビルドする。
  // NDK/CMakeのバージョン自体はプロジェクトルート側(react-native本体が既に
  // ネイティブビルドで使っている物)をそのまま継承する(ここでは指定しない)。
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}
