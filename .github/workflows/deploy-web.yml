name: Deploy Web App to GitHub Pages

# main への push、または手動実行でWeb版をビルドし、GitHub Pagesに公開します。
# GitHub Pagesは無料です。リポジトリの Settings > Pages で
# "Source" を "GitHub Actions" に設定してから使ってください。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set base path for GitHub Pages
        # GitHub Pagesはリポジトリ名のサブパス(https://<user>.github.io/<repo>/)で
        # 配信されるため、app.json の experiments.baseUrl にリポジトリ名を書き込む
        run: |
          node -e "
            const fs = require('fs');
            const path = './app.json';
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json.expo.experiments = { ...(json.expo.experiments || {}), baseUrl: '/${GITHUB_REPOSITORY#*/}' };
            fs.writeFileSync(path, JSON.stringify(json, null, 2));
          "

      - name: Export static web build
        run: npx expo export --platform web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
