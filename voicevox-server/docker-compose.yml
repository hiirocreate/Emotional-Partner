# VOICEVOX ENGINE を常時稼働・HTTPS公開するための構成。
# Caddy がドメイン(.env の DUCKDNS_DOMAIN)宛のリクエストを受け、
# 自動でLet's Encrypt証明書を取得しつつ VOICEVOX ENGINE にプロキシする。
# VOICEVOX自体は外部に直接公開しない(平文HTTPでの直接アクセスを防ぐため)。
#
# 使い方: README.md の「VOICEVOXを場所を問わず・スリープなしで使う」を参照。
#   1. .env.example を .env にコピーし、DUCKDNS_DOMAIN を自分のドメインに書き換える
#   2. docker compose up -d

services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: always
    # デフォルトはlocalhost等からのアクセスのみ許可(CORS)。
    # アプリ(Web版)は別オリジンから接続するため、全オリジン許可にする。
    # (commandを上書きすると元のコマンド全体が消えるため、デフォルト分もすべて明示する)
    # --cpu_num_threads: 未指定だと論理コア数の半分(e2-microだと1スレッド)しか使わない。
    # e2-microはvCPU2基(バースト時のみ)なので、明示的に2を指定してバースト時に使い切れるようにする。
    command: ["gosu", "user", "/opt/voicevox_engine/run", "--host", "0.0.0.0", "--cors_policy_mode", "all", "--cpu_num_threads", "2"]
    expose:
      - "50021"

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - voicevox

volumes:
  caddy_data:
  caddy_config:
